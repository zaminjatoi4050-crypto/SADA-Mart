# SADA Mart Backend Configuration
spring.main.web-application-type=none
spring.main.banner-mode=off

# Oracle thin JDBC configuration
sadamart.oracle.enabled=${SADAMART_ORACLE_ENABLED:false}
sadamart.oracle.host=${SADAMART_ORACLE_HOST:localhost}
sadamart.oracle.port=${SADAMART_ORACLE_PORT:1521}
sadamart.oracle.service=${SADAMART_ORACLE_SERVICE:FREEPDB1}
sadamart.oracle.username=${SADAMART_ORACLE_USERNAME:}
sadamart.oracle.password=${SADAMART_ORACLE_PASSWORD:}
sadamart.oracle.tcps=${SADAMART_ORACLE_TCPS:false}

# Liquibase and Hibernate settings
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
